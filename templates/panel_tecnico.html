<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_lab.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">LabAssistant - Zona técnica</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="alert alert-success text-center">
                    <h4>Hola, {{ session.get('usuario', 'técnico') }}</h4>
                    <p class="mb-0">Bienvenido a tu panel de herramientas.</p>
                </div>

                <div class="card shadow-lg border-primary mt-4">
                    <div class="card-header bg-primary text-white text-center">
                        Herramienta principal
                    </div>
                    <div class="card-body text-center p-5">
                        <h2 class="card-title text-primary mb-3">Asistente de diagnóstico</h2>
                        <p class="card-text lead">
                            Sistema de resolución guiada de incidencias en equipos, controles de calidad y muestras.
                        </p>
                        <hr>
                        <a href="{{ url_for('troubleshooting') }}" class="btn btn-primary btn-lg px-5">Iniciar diagnóstico</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
