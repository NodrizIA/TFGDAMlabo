name: Empaquetar App Flask

# ¿Cuándo arranca el robot? Cada vez que subimos código a la rama main
on:
  push:
    branches:
      - main 

jobs:
  empaquetar-y-subir:
    runs-on: ubuntu-latest # El robot usará un servidor Linux gratuito de GitHub

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v3

    - name: 2. Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 3. Construir y Subir la imagen
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: nodrizia/mi-app-flask:latest
    - name: 4. Desplegar en AWS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo docker pull TU_USUARIO_DOCKER/mi-app-flask:latest
          sudo docker stop app-flask || true
          sudo docker rm app-flask || true
          sudo docker run -d --name app-flask -p 5000:5000 nodrizia/mi-app-flask:latest
